<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starlight Postcard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="star-field" id="star-field" aria-hidden="true"></div>

  <!-- Tahap 1: Kartu Pos Terkunci -->
  <main id="stage-seal" class="stage">
    <section class="postcard" aria-label="Interactive starlight postcard">
      <div class="postcard-top">
        <span class="tag">AIRMAIL // PIXEL EDITION</span>
        <span class="stamp">✦ 01</span>
      </div>

      <p class="sender-note">A small note addressed to you</p>

      <div class="seal-zone">
        <div id="orbit-ring" class="orbit-ring" aria-hidden="true">
          <span id="dart" class="dart">➤</span>
        </div>
        <button id="seal-btn" class="seal-btn" type="button" aria-label="Unlock postcard">
          <span class="seal-icon">✦</span>
          <span class="seal-text">TAP SEAL</span>
        </button>
      </div>

      <p class="helper-note">Click the seal or press Enter to unseal</p>
    </section>
  </main>

  <!-- Tahap 2: Kartu Interaktif -->
  <section id="stage-card" class="stage hidden" aria-live="polite">
    <div class="console-card">
      <div class="console-bar">
        <span class="console-title">NOTEBOOK.EXE</span>
        <div class="console-pips" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <!-- Halaman Pertanyaan -->
      <div id="prompt-panel" class="console-body">
        <p class="eyebrow">SPECIAL TRANSMISSION</p>
        <h1 class="headline">Ready for our next chapter together? ✨</h1>

        <canvas id="mascot-canvas" width="112" height="96" aria-label="Pixel bunny holding a star"></canvas>

        <div id="choice-zone" class="choice-zone">
          <button id="yes-choice" class="choice-btn primary" type="button">COUNT ME IN</button>
          <button id="dodge-choice" class="choice-btn secondary" type="button">NOT YET</button>
        </div>
      </div>

      <!-- Halaman Konfirmasi -->
      <div id="result-panel" class="console-body hidden">
        <p class="eyebrow">STATUS UPDATED</p>
        <h2 class="headline">Awesome! Best decision ever ✨</h2>

        <canvas id="mascot-happy-canvas" width="112" height="96" aria-label="Happy pixel bunny"></canvas>

        <p class="caption">Saved to our favorite memories log.</p>
        <div class="pill-badge">CHAPTER UNLOCKED ✦</div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
