<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Irfan For You ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="fx-grain"></div>
  </div>

  <!-- Hujan hati saat sudah klik YES -->
  <div id="heart-rain" class="heart-rain" aria-hidden="true"></div>

  <!-- SCENE 1: Amplop & Panah Cupid -->
  <main id="scene-envelope" class="scene active">
    <div class="envelope-stage" role="application" aria-label="Interactive love envelope">
      <div id="envelope" class="envelope" aria-label="Love envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-body"></div>
        <div id="target" class="target" title="Aim here">♥</div>
      </div>

      <p class="from-label">From Irfan For You ♥</p>

      <div class="archery-area">
        <div id="arrow" class="arrow" aria-hidden="true">
          <span class="arrow-head">▲</span>
          <span class="arrow-shaft"></span>
        </div>
        <div class="bow" aria-hidden="true"></div>
      </div>

      <p id="hint-text" class="hint-text">Click, drag, or press Space to shoot ♥</p>
    </div>
  </main>

  <!-- SCENE 2: Popup Window LOVE -->
  <section id="scene-proposal" class="scene hidden" aria-live="polite">
    <div class="retro-window">
      <div class="window-header">
        <span class="window-title">LOVE</span>
        <div class="window-controls" aria-hidden="true">
          <span>−</span>
          <span>□</span>
          <span>×</span>
        </div>
      </div>

      <div class="window-dots" aria-hidden="true">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
      </div>

      <!-- State Pertanyaan -->
      <div id="ask-view" class="window-body">
        <h1 class="question-text">Do you want to be my girlfriend? ♡</h1>

        <canvas id="pixel-cat" width="112" height="96" aria-label="Pixel cat holding a heart"></canvas>

        <div id="button-arena" class="button-arena">
          <button id="yes-btn" class="btn btn-yes" type="button">YES</button>
          <button id="no-btn" class="btn btn-no" type="button">NO</button>
        </div>
      </div>

      <!-- State Setelah Klik YES -->
      <div id="accepted-view" class="window-body hidden">
        <h2 class="yay-text">Yayyy! I love you ♡</h2>

        <canvas id="pixel-cat-happy" width="112" height="96" aria-label="Happy pixel cat"></canvas>

        <p class="sub-message">I'm really happy you can accept me</p>
        <div class="love-badge">I LOVE YOU ♥</div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
